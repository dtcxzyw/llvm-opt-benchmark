name: DAG grep

on:
  issues:
    types: labeled

jobs:
  build:
    if: github.event.label.name == 'grep'
    runs-on: self-hosted

    permissions:
      issues: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git submodule update --init llvm/llvm-project
          git -C llvm/llvm-project checkout .
          git -C llvm/llvm-project clean -fdx

      - name: Get Pattern IR
        run: |
          echo "${TEXT}" | sed -n '/^```/,/^```/ p' | sed '/^```/ d' > ${{ github.workspace }}/test.ll
          cat ${{ github.workspace }}/test.ll
        env:
          TEXT: ${{ github.event.issue.body }}

      - name: Run LLVM DAG Grep
        run: |
          ${{ github.workspace }}/scripts/run_dag_grep.sh
          cat ${{ github.workspace }}/scripts/grep.md

      - name: Report
        uses: thollander/actions-comment-pull-request@v2
        with:
          filePath: scripts/grep.md
